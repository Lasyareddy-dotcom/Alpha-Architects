[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evodrift"
version = "1.0.0"
description = "Adaptive multi-objective evolutionary deep learning for non-stationary classification"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["evodrift*"]
